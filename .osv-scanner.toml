reason = "Kover's coverage reporter (intellij-coverage-reporter), test tooling, not shipped in the APK: absent from the debug and release runtime and compile classpaths, checked with ./gradlew :app:dependencies on 2026-11-10. GHSA-27j2-h3m2-8237 (Critical, path traversal in template loading) needs an attacker-supplied template path, and only the tool's bundled templates are loaded. Fixed in 2.3.35: drop this entry with the stack update (#10)."
