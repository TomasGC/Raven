ignore = true
reason = "AGP 8.7.3 build tool dependency (the build classpath and the Unified Test Platform host tools), not shipped in the APK: absent from the debug and release runtime and compile classpaths, checked with ./gradlew buildEnvironment :app:dependencies on 2026-11-10. GHSA-xxph-c9ww-hj94 (High) is a memory exhaustion when deserializing attacker-controlled streams, which neither the build nor the tests do. Fixed in 33.7.2: drop this entry with the stack update (#10)."

