name: Push-CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-pipeline:
    uses: TomasGC/Condor/.github/workflows/kotlin-push-ci.yml@v1
    secrets: inherit
    with:
      app-name: raven
      unit-tasks: '[":core:test", ":placeholder:test", ":app:testDebugUnitTest"]'
      app-environments: '["android"]'
      # The instrumented tests are white-box tests of :app (Hilt, MainActivity), so they cannot move to a test module.
      android-e2e-task: ':app:connectedDebugAndroidTest'

  python-pipeline:
    uses: TomasGC/Condor/.github/workflows/python-push-ci.yml@v1
    with:
      skip-on-no-changes: true
